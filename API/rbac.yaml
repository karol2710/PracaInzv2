apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin-api-cr
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-api-crb
subjects:
  - kind: ServiceAccount
    name: admin-api-sa
    namespace: admin-api
roleRef:
  kind: ClusterRole
  name: admin-api-cr
  apiGroup: rbac.authorization.k8s.io