apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin-API-CR
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-API-CRB
subjects:
  - kind: ServiceAccount
    name: admin-API-SA
    namespace: admin-API
roleRef:
  kind: ClusterRole
  name: admin-API-CR
  apiGroup: rbac.authorization.k8s.io