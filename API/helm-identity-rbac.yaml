apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-helm-deployer
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - secrets
  - services
  - persistentvolumeclaims
  verbs:
  - create
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin-api-helm-identity
rules:
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - create
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  resourceNames:
  - platform-helm-deployer
  verbs:
  - bind
- apiGroups:
  - ''
  resources:
  - serviceaccounts/token
  resourceNames:
  - platform-helm-deployer
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-api-helm-identity
subjects:
- kind: ServiceAccount
  name: admin-api-sa
  namespace: admin-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin-api-helm-identity
