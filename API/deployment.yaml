apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-API-Deployment
  namespace: admin-API
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-API
  template:
    metadata:
      labels:
        app: admin-API
    spec:
      serviceAccountName: admin-API-SA
      containers:
        - name: admin-API
          image: yoghlol/prcainz:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL