apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api-deployment
  namespace: admin-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      serviceAccountName: admin-api-sa
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: admin-api
          image: yoghlol/pracainz:0.5
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CLIENT_PROVISIONING_ENABLED
              value: "false"
            - name: HELM_DEPLOYMENT_ENABLED
              value: "false"
            - name: HELM_ALLOWED_HOSTS
              value: ""
            - name: POSTGRES_HOST
              value: admin-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: CLIENTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-postgres-secret
                  key: CLIENTS_DB_PASSWORD
            - name: CLUSTER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-postgres-secret
                  key: CLUSTER_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL