apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .RouteName }}
  namespace: {{ .Namespace }}
spec:
  parentRefs:
    - name: platform-gateway
      namespace: envoy-gateway-system
      sectionName: {{ .ListenerName }}
  hostnames:
    - "{{ .Domain }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .BackendService }}
          port: {{ .BackendPort }}
