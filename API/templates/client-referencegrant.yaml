apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: "{{ .RouteName }}-tls"
  namespace: "{{ .Namespace }}"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: envoy-gateway-system
  to:
    - group: ""
      kind: Secret
      name: "{{ .TLSSecret }}"
