apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: "{{ .RouteName }}-ratelimit"
  namespace: "{{ .Namespace }}"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: "{{ .RouteName }}"
  rateLimit:
    local:
      rules:
        - limit:
            requests: {{ .RateLimitRPS }}
            unit: Second
