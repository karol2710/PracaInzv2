apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-helm-deployer
  namespace: CLIENT_NAMESPACE
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-helm-deployer
  namespace: CLIENT_NAMESPACE
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  - secrets
  - services
  - persistentvolumeclaims
  verbs:
  - create
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-helm-deployer
  namespace: CLIENT_NAMESPACE
subjects:
- kind: ServiceAccount
  name: platform-helm-deployer
  namespace: CLIENT_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-helm-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-helm-namespace-read-CLIENT_NAMESPACE
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  verbs:
  - get
  resourceNames:
  - CLIENT_NAMESPACE
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-helm-namespace-read-CLIENT_NAMESPACE
subjects:
- kind: ServiceAccount
  name: platform-helm-deployer
  namespace: CLIENT_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-helm-namespace-read-CLIENT_NAMESPACE
