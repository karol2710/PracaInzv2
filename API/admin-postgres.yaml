
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-postgres-init
  namespace: admin-api
data:
  init-databases.sh: |
    #!/bin/bash
    set -e

    psql -v ON_ERROR_STOP=1 \
      --username "$POSTGRES_USER" \
      --dbname "$POSTGRES_DB" <<-EOSQL
      CREATE ROLE admin_clients_user
        LOGIN PASSWORD '${CLIENTS_DB_PASSWORD}';

      CREATE ROLE admin_cluster_user
        LOGIN PASSWORD '${CLUSTER_DB_PASSWORD}';

      CREATE DATABASE admin_clients
        OWNER admin_clients_user;

      CREATE DATABASE admin_cluster
        OWNER admin_cluster_user;
    EOSQL
---
apiVersion: v1
kind: Service
metadata:
  name: admin-postgres-headless
  namespace: admin-api
spec:
  clusterIP: None
  selector:
    app: admin-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: admin-postgres
  namespace: admin-api
spec:
  type: ClusterIP
  selector:
    app: admin-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: admin-postgres
  namespace: admin-api
spec:
  serviceName: admin-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: admin-postgres
  template:
    metadata:
      labels:
        app: admin-postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: CLIENTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-postgres-secret
                  key: CLIENTS_DB_PASSWORD
            - name: CLUSTER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-postgres-secret
                  key: CLUSTER_DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-scripts
          configMap:
            name: admin-postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: platform-storageclass
        resources:
          requests:
            storage: 10Gi
